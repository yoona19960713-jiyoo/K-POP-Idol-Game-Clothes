name: 打包衣帽間工坊

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-and-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 檢查簽章金鑰
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::還沒設定 KEYSTORE_B64 這個 Secret,請照說明把簽章金鑰貼進 Settings → Secrets and variables → Actions"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 寫入版本號
        run: echo "window.APP_VERSION = \"1.0.${{ github.run_number }}\";" > www/version.js

      - name: 安裝套件
        run: npm install --no-audit --no-fund

      - name: 建立 Android 專案
        run: |
          npx cap add android
          npx cap sync android

      - name: 打包 APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: 簽章(每次都用同一把金鑰,更新時不用解除安裝)
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KS" | base64 -d > ks.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks ks.jks --ks-pass pass:kpopclothes --key-pass pass:kpopclothes --ks-key-alias clothes --out KPOP-Clothes.apk aligned.apk
          rm ks.jks

      - name: 發布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" KPOP-Clothes.apk \
            --title "衣帽間工坊 1.0.${{ github.run_number }}" \
            --notes "自動產生的安裝檔"

      - name: 準備網頁版
        run: |
          cp KPOP-Clothes.apk www/KPOP-Clothes.apk
          touch www/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
